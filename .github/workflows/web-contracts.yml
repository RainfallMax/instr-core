name: Web Contract Gate

on:
  pull_request:
    paths:
      - ".github/workflows/web-contracts.yml"
      - "scripts/verify-web-contracts.py"
      - "src/instr_core/schema.py"
      - "src/instr_core/validator.py"
      - "tests/test_web_contracts.py"
      - "tests/test_web_registry.py"
      - "tests/fixtures/web_contracts/**"
      - "tests/fixtures/web_registry/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-contracts.yml"
      - "scripts/verify-web-contracts.py"
      - "src/instr_core/schema.py"
      - "src/instr_core/validator.py"
      - "tests/test_web_contracts.py"
      - "tests/test_web_registry.py"
      - "tests/fixtures/web_contracts/**"
      - "tests/fixtures/web_registry/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  verify-web-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out instr-core
        uses: actions/checkout@v4
        with:
          path: instr-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install instr-core dependencies
        working-directory: instr-core
        run: uv sync --group dev

      - name: Verify synced web contracts
        working-directory: instr-core
        run: uv run pytest tests/test_web_contracts.py tests/test_web_registry.py -v
